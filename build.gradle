plugins {
    id 'org.springframework.boot' version '2.6.6'  // Spring Boot Plugin
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'  // Dependency Management Plugin
    id 'java'  // Java plugin
}

group = 'com.azcord'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

repositories {
    mavenCentral()  // Maven repository
}

dependencies {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'io.jsonwebtoken:jjwt:0.12.6'
        implementation 'org.projectlombok:lombok:1.18.28'
        annotationProcessor 'org.projectlombok:lombok:1.18.28'
        runtimeOnly 'com.h2database:h2'
    }

}

test {
    useJUnitPlatform()  // JUnit 5 support for testing
}
